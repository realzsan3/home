  <style>
    :root {
      --bg: #ffffff;
      --bg-sub: #f7f7f7;
      --text: #111111;
      --text-muted: #666666;
      --text-faint: #aaaaaa;
      --border: rgba(0,0,0,0.08);
      --border-mid: rgba(0,0,0,0.12);
      --accent: #7f77dd;
      --accent-light: #eeedfe;
      --accent-dark: #534ab7;
      --green: #1d9e75;
      --green-light: #e1f5ee;
      --green-dark: #0f6e56;
      --radius: 14px;
      --radius-sm: 8px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f0f0f;
        --bg-sub: #1a1a1a;
        --text: #f0f0f0;
        --text-muted: #888888;
        --text-faint: #555555;
        --border: rgba(255,255,255,0.07);
        --border-mid: rgba(255,255,255,0.12);
        --accent: #afa9ec;
        --accent-light: rgba(127,119,221,0.12);
        --accent-dark: #cec9f6;
        --green: #5dcaa5;
        --green-light: rgba(29,158,117,0.12);
        --green-dark: #9fe1cb;
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { font-size: 16px; -webkit-text-size-adjust: 100%; }

    body {
      font-family: 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* ── NAV ── */
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 48px;
      border-bottom: 0.5px solid var(--border);
    }

    .nav-logo {
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
    }

    .nav-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    .nav-domain {
      font-size: 12px;
      color: var(--text-faint);
      letter-spacing: 0.02em;
    }

    /* ── HERO ── */
    .hero {
      flex: 1;
      padding: 100px 48px 80px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .hero-greeting {
      font-size: clamp(48px, 8vw, 80px);
      font-weight: 500;
      color: var(--text);
      letter-spacing: -0.04em;
      line-height: 1.05;
      margin-bottom: 48px;
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp 0.6s ease forwards;
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .yiyan-wrap {
      max-width: 600px;
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.6s ease 0.2s forwards;
    }

    .yiyan-block {
      background: var(--bg-sub);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 22px;
      display: flex;
      gap: 14px;
      align-items: flex-start;
      cursor: default;
      transition: border-color 0.2s;
    }

    .yiyan-block:hover { border-color: var(--border-mid); }

    .yiyan-bar {
      width: 2px;
      border-radius: 2px;
      flex-shrink: 0;
      align-self: stretch;
      min-height: 20px;
      transition: background 0.4s;
    }

    .yiyan-bar.api  { background: var(--accent); }
    .yiyan-bar.custom { background: var(--green); }

    .yiyan-inner { flex: 1; min-width: 0; }

    .yiyan-text {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.85;
      font-style: italic;
      word-break: break-all;
      transition: color 0.3s;
    }

    .yiyan-text.loading { color: var(--text-faint); animation: blink 1.4s ease-in-out infinite; }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .yiyan-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      flex-wrap: wrap;
      gap: 6px;
    }

    .yiyan-from {
      font-size: 12px;
      color: var(--text-faint);
      font-style: normal;
    }

    .yiyan-badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 20px;
      letter-spacing: 0.03em;
      font-style: normal;
      transition: all 0.3s;
    }

    .yiyan-badge.api    { background: var(--accent-light); color: var(--accent-dark); }
    .yiyan-badge.custom { background: var(--green-light);  color: var(--green-dark);  }

    /* ── ENTRIES ── */
    .entries {
      border-top: 0.5px solid var(--border);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      opacity: 0;
      animation: fadeUp 0.6s ease 0.35s forwards;
    }

    .entry {
      padding: 40px 48px;
      border-right: 0.5px solid var(--border);
      text-decoration: none;
      display: flex;
      flex-direction: column;
      transition: background 0.15s;
      position: relative;
      overflow: hidden;
    }

    .entry::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      width: 0; height: 2px;
      background: var(--accent);
      transition: width 0.3s ease;
    }

    .entry:hover { background: var(--bg-sub); }
    .entry:hover::after { width: 100%; }
    .entry:last-child { border-right: none; }

    .entry-label {
      font-size: 10px;
      color: var(--text-faint);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .entry-title {
      font-size: 18px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    .entry-desc {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.65;
      flex: 1;
    }

    .entry-arrow {
      font-size: 18px;
      color: var(--accent);
      margin-top: 24px;
      display: block;
      transition: transform 0.2s;
    }

    .entry:hover .entry-arrow { transform: translateX(4px); }

    /* ── FOOTER ── */
    .footer {
      border-top: 0.5px solid var(--border);
      padding: 18px 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-copy {
      font-size: 12px;
      color: var(--text-faint);
    }

    .footer-github {
      font-size: 12px;
      color: var(--text-faint);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }

    .footer-github:hover { color: var(--text-muted); }

    .footer-github svg {
      width: 14px; height: 14px;
      fill: currentColor;
    }

    /* ── MOBILE ── */
    @media (max-width: 640px) {
      .nav   { padding: 16px 20px; }
      .hero  { padding: 64px 20px 56px; }

      .entries {
        grid-template-columns: 1fr;
      }

      .entry {
        padding: 28px 20px;
        border-right: none;
        border-bottom: 0.5px solid var(--border);
      }

      .entry:last-child { border-bottom: none; }
      .entry::after { display: none; }

      .footer { padding: 16px 20px; }
    }

    @media (min-width: 641px) and (max-width: 900px) {
      .nav  { padding: 18px 32px; }
      .hero { padding: 80px 32px 64px; }

      .entries { grid-template-columns: repeat(3, 1fr); }

      .entry { padding: 32px; }

      .footer { padding: 18px 32px; }
    }
  </style>
</head>

      "每当有事情发生, 懦夫会问: '这么做安全吗?'\t患得患失者会问: '这么做明智吗?'\t虚荣者会问: '这么做受欢迎吗?'\t但是良知只会问: '这么做正确吗?'\t@马丁.路德.金 (美国人权领袖)",
      "雪崩时, 没有一片雪花觉得自己有责任\t@伏尔泰 (启蒙思想家)",
      "以铜为镜 可以正衣冠\t以史为镜 可以知兴替\t以人为镜 可以明得失\t@李世民 (唐太宗)",

      "水至清则无鱼\t人至察则无徒\t@<汉书 东方朔传>",
      "不怕神一样的对手\t就怕猪一样的队友",

      "努力改变自己能改变的，躺平接受自己不能改变的。",
      "少买垃圾，用有限资源买品质好的。",
      "多攒钱，股市不缺机会，缺现金。",
    ];

    // 解析原始格式：tab 分隔，最后一段以 @ 开头的为作者
    function parseRaw(raw) {
      const parts = raw.split('\t').map(s => s.trim()).filter(Boolean);
      let from = '';
      const textParts = [];
      parts.forEach(p => {
        if (p.startsWith('@')) from = '— ' + p.slice(1);
        else textParts.push(p);
      });
      return { text: textParts.join(' '), from };
    }

    const customs = rawSentences.map(parseRaw);

    function setYiyan(text, from, type) {
      const el    = document.getElementById('yy-text');
      const bar   = document.getElementById('yy-bar');
      const badge = document.getElementById('yy-badge');
      const fromEl= document.getElementById('yy-from');

      el.classList.remove('loading');
      el.textContent   = text;
      fromEl.textContent = from || '';

      bar.className   = 'yiyan-bar ' + type;
      badge.className = 'yiyan-badge ' + type;
      badge.textContent = type === 'api' ? '一言' : '箴言';
    }

    function showCustom() {
      const p = customs[Math.floor(Math.random() * customs.length)];
      setYiyan(p.text, p.from, 'custom');
    }

    // 50% 概率走官方 API，50% 走自定义
    if (Math.random() > 0.5) {
      fetch('https://v1.hitokoto.cn/?encode=json')
        .then(r => r.json())
        .then(d => setYiyan(d.hitokoto, d.from ? '— ' + d.from : '', 'api'))
        .catch(showCustom);
    } else {
      showCustom();
    }
  </script>
